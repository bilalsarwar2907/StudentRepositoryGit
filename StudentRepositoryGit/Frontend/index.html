<!DOCTYPE html>
<html lang="en">

<!-- <head> = contains settings for the page (not visible content) -->

<head>
    <!-- <head> = contains settings for the page (not visible content) -->

    <!-- CHARACTER SET -->
    <meta charset="UTF-8">
    <!-- CHARACTER SET -->

    <!-- MAKES PAGE RESPONSIVE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- MAKES PAGE RESPONSIVE -->

    <!-- TITLE SHOWN IN BROWSER TAB -->
    <title>Students Api</title>
    <!-- TITLE SHOWN IN BROWSER TAB -->

    <!-- BOOTSTRAP = ready-made styles (buttons, table, layout) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <!-- BOOTSTRAP = ready-made styles (buttons, table, layout) -->

    <!-- YOUR OWN STYLES -->
    <link rel="stylesheet" href="index.css" />
    <!-- YOUR OWN STYLES -->

</head>

<!-- <body> = everything visible on the page -->

<body>
    <!-- <body> = everything visible on the page -->


    <!-- MAIN CONTAINER -->
    <!-- <div> = general container (box) used to group elements -->
    <div id="app" class="container my-5">
        <!-- <div> = general container (box) used to group elements -->

        <!-- HEADER SECTION -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <!-- <h1> = heading/title -->
            <h1 class="h3"> STUDENTS MANAGEMENT</h1>
        </div>
        <!-- HEADER SECTION -->


        <!-- FILTER SECTION -->
        <!-- <div class="card"> = styled box (Bootstrap) -->
        <div class="card mb-3">
            <div class="card-body">

                <div class="row g-2 align-items-end">

                    <!-- INPUT -->
                    <div class="col-md-3">
                        <input v-model="studentsFilter" class="form-control" placeholder="Filter by Name..." />
                    </div>

                    <!-- FILTER BUTTON (FIXED) -->
                    <div class="col-md-2">
                        <button class="btn btn-secondary w-100" @click="filterByName(studentsFilter)">Filter</button>
                    </div>

                    <!-- RESET BUTTON -->
                    <div class="col-md-2">
                        <button class="btn btn-outline-dark w-100" @click="getAllStudents()">All</button>
                    </div>

                    <!-- SORT BUTTONS -->
                    <div class="col-md-5">
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-primary btn-sm" @click="sortById()">ID ↑</button>
                            <button class="btn btn-outline-primary btn-sm" @click="sortByName()">Name ↑</button>
                            <button class="btn btn-outline-primary btn-sm" @click="sortByAgeAscending()">BirthYear
                                ↑</button>
                            <button class="btn btn-outline-primary btn-sm" @click="sortByAgeDescending()">BirthYear

                                ↓</button>
                            <button class="btn btn-outline-primary btn-sm" @click="sortByGradeDescending()">Grade
                                ↓</button>
                            <button class="btn btn-outline-primary btn-sm" @click="sortByGradeAscending()">Grade
                                ↑</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <!-- End//////// FILTER SECTION -->

        <!-- TABLE SECTION -->
        <!-- <table> = displays data in rows and columns -->
        <table class="table table-striped table-hover">

            <!-- <thead> = table header (column titles) -->
            <thead class="table-dark">
                <tr> <!-- <tr> = table row -->
                    <th>ID</th> <!-- <th> = header cell -->
                    <th>Name</th>
                    <th>BirthYear</th>
                    <th>Grade</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <!-- <tbody> = table data -->
            <tbody>

                <!-- LOOP THROUGH DATA -->
                <tr v-for="student in students" :key="student.id">
                    <!-- <td> = table data cell -->
                    <td>{{ student.id }}</td>
                    <td>{{ student.name }}</td>
                    <td>{{ student.birthYear }}</td>
                    <td>{{ student.grade }}</td>

                    <td>
                        <button class="btn btn-sm btn-danger" @click="deleteStudent(student.id)">Delete</button>
                    </td>
                </tr>

                <!-- SHOW MESSAGE IF EMPTY -->
                <tr v-if="students.length === 0">
                    <td colspan="4" class="text-center text-muted">No students found.</td>
                </tr>

            </tbody>
        </table>

        <!-- End//////////////TABLE -->

        <!-- SMALL TEXT MESSAGE -->
        <!-- <div> used here just to display text -->
        <div class="text-muted small">{{ studentsMessage }}</div>
        <!-- SMALL TEXT MESSAGE -->

        <!-- ADD STUDENT SECTION -->
        <div class="card mt-3">
            <div class="card-body">

                <!-- <h5> = smaller heading -->
                <h5 class="card-title">➕ Add New Student</h5>

                <div class="row g-2">

                    <!-- DESIGN INPUT -->
                    <div class="col-md-3">
                        <input v-model="addData.name" class="form-control" placeholder="Name" />
                    </div>

                    <!-- NUMBER INPUT -->
                    <div class="col-md-2">
                        <input v-model.number="addData.birthYear" type="number" class="form-control"
                            placeholder="BirthYear" />
                    </div>

                    <!--Grade INPUT -->
                    <div class="col-md-2">
                        <input v-model="addData.grade" class="form-control" placeholder="Grade" />
                    </div>

                    <!-- ADD BUTTON -->
                    <div class="col-md-2">
                        <button class="btn btn-success w-100" @click="addStudent()">Add</button>
                    </div>

                </div>

                <!-- MESSAGE -->
                <div class="mt-2 text-muted small">{{ addMessage }}</div>
            </div>
        </div>
        <!--End//////// ADD STUDENT SECTION -->

        <!-- UPDATE STUDENT SECTION -->
        <div class="card mt-3">
            <div class="card-body">

                <!-- <h5> = smaller heading -->
                <h5 class="card-title"> UPDATE The Student</h5>

                <div class="row g-2">


                    <!-- NUMBER INPUT -->
                    <div class="col-md-3">
                        <input v-model.number="updateData.id" type="number" class="form-control"
                            placeholder="Student ID" />
                    </div>

                    <!-- NAME INPUT -->
                    <div class="col-md-3">
                        <input v-model="updateData.name" class="form-control" placeholder="Name" />
                    </div>

                    <!-- NUMBER INPUT -->
                    <div class="col-md-2">
                        <input v-model.number="updateData.birthYear" type="number" class="form-control"
                            placeholder="BirthYear" />
                    </div>

                    <!-- Grade INPUT -->
                    <div class="col-md-2">
                        <input v-model="updateData.grade" class="form-control" placeholder="Grade" />
                    </div>

                    <!-- ADD BUTTON -->
                    <div class="col-md-2">
                        <button class="btn btn-success w-100" @click="updateStudent">UPDATE</button>
                    </div>

                </div>

                <!-- MESSAGE -->
                <div class="mt-2 text-muted small">{{ updateMessage }}</div>
            </div>
        </div>
        <!-- End //////////UPDATE STUDENT SECTION -->

        <!-- DELETE BY ID SECTION -->
        <div class="card mt-3">
            <div class="card-body">

                <h5 class="card-title">🗑️ Delete by ID</h5>

                <div class="row g-2">

                    <!-- NUMBER INPUT -->
                    <div class="col-md-3">
                        <input v-model.number="deleteId" type="number" class="form-control" placeholder="Student ID" />
                    </div>

                    <!-- DELETE BUTTON -->
                    <div class="col-md-3">
                        <button class="btn btn-danger w-100" @click="deleteStudent(deleteId)">Delete</button>
                    </div>

                </div>

                <!-- MESSAGE -->
                <div class="mt-2 text-muted small">{{ deleteMessage }}</div>
            </div>
        </div>

    </div>
    <!-- End //////////////////DELETE BY ID SECTION -->

    <!-- END////////////////////////// MAIN CONTAINER -->

    <!-- JAVASCRIPT SECTION -->

    <!-- Vue = framework (handles data + UI) -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>

    <!-- Axios = used to call API (GET, POST, DELETE, PUT) -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- YOUR JS FILE -->
    <script src="index.js"></script>

</body>

</html>
<!--END //////////////// JAVASCRIPT SECTION -->
